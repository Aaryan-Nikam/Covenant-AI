ruleset_id: hipaa
name: "HIPAA"
version: "2024"
industry: healthcare
description: "Health Insurance Portability and Accountability Act. Protects Protected Health Information (PHI)."

detectors:
  - id: ssn
    name: "Social Security Number"
    data_type: ssn
    layer: 1
    patterns:
      - '\b(?!000|666)[0-9]{3}-(?!00)[0-9]{2}-(?!0000)[0-9]{4}\b'
      - '\b(?!000|666)[0-9]{3}\s(?!00)[0-9]{2}\s(?!0000)[0-9]{4}\b'
      - '\b(?!000|666)[0-9]{3}\.(?!00)[0-9]{2}\.(?!0000)[0-9]{4}\b'
      - '(?i)(?:ssn|social.?security).{0,20}(?!000|666)[0-9]{9}\b'
    confidence_threshold: 0.959

  - id: patient_name
    name: "Patient Name"
    data_type: person_name
    layer: 3
    entity_class: PERSON
    context_required:
      keywords:
        - patient
        - diagnosis
        - prescription
        - doctor
        - hospital
        - medical
        - health
        - treatment
        - clinical
        - pharmacy
        - symptom
    confidence_threshold: 0.85

  - id: icd10
    name: "ICD-10 Diagnosis Code"
    data_type: diagnosis_code
    layer: 1
    patterns:
      - '\b[A-Z][0-9]{2}\.?[0-9A-Z]{0,4}\b'
    confidence_threshold: 0.9
    context_required:
      keywords:
        - diagnosis
        - icd
        - medical
        - condition
        - disease
        - disorder
        - symptom
        - clinical
        - patient
        - treatment

  - id: dob
    name: "Date of Birth"
    data_type: date_of_birth
    layer: 1
    patterns:
      - '\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\b'
    confidence_threshold: 0.8

  - id: npi
    name: "National Provider Identifier"
    data_type: npi_number
    layer: 1
    patterns:
      - '\b[0-9]{10}\b'
    confidence_threshold: 0.75

actions:
  ssn:
    primary: tokenize
    fallback: block
    log_level: critical

  person_name:
    primary: pseudonymize
    fallback: mask
    log_level: high

  diagnosis_code:
    primary: mask
    fallback: block
    log_level: high

  date_of_birth:
    primary: mask
    fallback: block
    log_level: high

  npi_number:
    primary: tokenize
    fallback: block
    log_level: high

audit:
  retention_days: 2555
  required_fields:
    - timestamp
    - agent_id
    - data_type
    - action_taken
    - access_reason
    - request_hash
