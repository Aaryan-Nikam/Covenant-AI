ruleset_id: soc2
name: "SOC2 Type II"
version: "2017"
industry: general
description: "SOC2 compliance. Focuses on audit trail completeness and access logging."

detectors:
  - id: api_key
    name: "API Key or Secret"
    data_type: api_key
    layer: 1
    patterns:
      - '(?i)(?:sk|pk|api[_-]?key|token|secret|bearer)[^\w]{0,10}?([A-Za-z0-9\-_]{20,})'
      - '\bsk-[A-Za-z0-9]{40,}\b'
      - '\b(?:sk|pk)_(?:live|test)_[A-Za-z0-9]{20,}\b'
      - '(?i)SECRET_KEY[^\w]{0,5}([A-Za-z0-9\-_]{20,})'
    confidence_threshold: 0.9

  - id: internal_ip
    name: "Internal IP Address"
    data_type: ip_address
    layer: 1
    patterns:
      - '\b10\.\d{1,3}\.\d{1,3}\.\d{1,3}\b'
      - '\b192\.168\.\d{1,3}\.\d{1,3}\b'
      - '\b172\.(1[6-9]|2[0-9]|3[01])\.\d{1,3}\.\d{1,3}\b'
    confidence_threshold: 0.95

  - id: password_pattern
    name: "Password in Content"
    data_type: password
    layer: 1
    patterns:
      - '(?i)(password|passwd|pwd)\s*[=:]\s*\S+'
    confidence_threshold: 0.85

actions:
  api_key:
    primary: block
    fallback: block
    log_level: critical

  ip_address:
    primary: mask
    fallback: block
    log_level: medium

  password:
    primary: block
    fallback: block
    log_level: critical

audit:
  retention_days: 365
  required_fields:
    - timestamp
    - agent_id
    - data_type
    - action_taken
    - request_hash
