# Ironpass — Railway deployment configuration
# https://docs.railway.app/reference/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.prod"

[deploy]
# Run migrations then boot — prevents boot-loop on fresh database.
# Railway injects $PORT; uvicorn reads it via the PORT env var in config.
startCommand = "alembic -c engine/alembic.ini upgrade head && uvicorn engine.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
