name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  backend_quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ironpass
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ironpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ironpass -d ironpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ironpass:secret@localhost:5432/ironpass
      REDIS_URL: redis://localhost:6379/0
      AUDIT_HMAC_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PSEUDONYM_SECRET_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      KEY_BACKEND: local
      LOCAL_VAULT_KEY: 1111111111111111111111111111111111111111111111111111111111111111
      IRONPASS_ADMIN_SECRET: ci_admin_secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r engine/requirements.txt

      - name: Verify no startup schema creation
        run: |
          if grep -rn "create_all" engine/ --include="*.py" | grep -v "database/migrations"; then
            echo "ERROR: create_all found outside Alembic migrations. Schema must be managed by migrations only."
            exit 1
          fi

      - name: Run migrations
        run: alembic -c engine/alembic.ini upgrade head

      - name: Verify migration rollback cycle
        run: |
          alembic -c engine/alembic.ini downgrade -1
          alembic -c engine/alembic.ini upgrade head

      - name: Verify migrations match models
        run: alembic -c engine/alembic.ini check

      - name: Run backend tests
        run: pytest -q

  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Build frontend
        run: |
          cd dashboard/frontend
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dashboard/frontend/dist
          if-no-files-found: error

  deploy_cloudflare:
    name: Deploy to Cloudflare Pages
    needs: [backend_quality, build_frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dashboard/frontend/dist

      - name: Check deployment secrets
        id: cf_secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cf_secrets.outputs.enabled == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ironpass
          directory: dashboard/frontend/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Deployment skipped notice
        if: steps.cf_secrets.outputs.enabled != 'true'
        run: |
          echo "Cloudflare deployment was skipped."
          echo "Set repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable deployment."
